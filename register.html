    <link rel="stylesheet" href="/style/style.css">
    <link rel="shortcut icon" href="Logo/fav.png" type="image/x-icon">
</head>
<body>
     <header>
        <img class="header-img" src="/Logo/logo.png" alt="">
        <h1 class="main-header">Tech World</h1>
        <p class="header-para">Your Gate to Technology</p>
    </header>
    <nav>
        <ul>
            <li><a href="style.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="services.html">Services</a></li>

            <li><a href="blog.html">Blog</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
    <section class="section-containers">
        <h1>Registeration Form</h1>

        <form class="form">
            <label for="">Full Name</label><br>
            <input type="text" placeholder="Enter your full name" class="inputs"><br>
            <label for="">Email Address</label><br>
            <input type="email" placeholder="Enter your email" class="inputs"><br>
            <label for="">Password</label><br>
            <input type="password" placeholder="Enter your password" class="inputs"><br>
            <label for="">Phone Number</label><br>
            <input type="tel" placeholder="Enter your Phone number" class="inputs"><br>

            <h3 class="header-skill-gender">Gender</h3>
            
            <label>
                <input type="radio" name="gender" value="male" class="skill-gender"> Male
            </label>
            
            <label>
                <input type="radio" name="gender" value="female" class="skill-gender"> Female
            </label>

            <h3 class="header-skill-gender">Skills</h3>

            <label>
                <input type="checkbox" class="skill-gender">HTML
            </label>

             <label>
                <input type="checkbox" class="skill-gender">CSS
            </label>

             <label>
                <input type="checkbox" class="skill-gender">JavaScript
            </label><br>
            <button class="reg-btn">Register Now</button>
        </form>
    </section>
    <footer>
            <p>

            </p>
